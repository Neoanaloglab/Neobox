<text x="527.6" y="722.0" font-size="12" fill="#333">·  Film, 0.14 mm thick. The image area floats — 0.4 mm of air below it, about 0.25 mm above.</text>
<text x="527.6" y="745.0" font-size="12" fill="#333">·  Land: 0.4 mm relief, 4.7 mm wide. Only the film edge rests here; nothing touches the image.</text>
<text x="527.6" y="768.0" font-size="12" fill="#333">·  Rail: 0.8 mm above the land. The lid sits on the rails, the pressure strips take up 0.4 of that gap, and the 0.4 left over is the channel.</text>
<text x="527.6" y="791.0" font-size="12" fill="#333">·  Channel: 0.4 mm — loose enough for the film to slide, tight enough to hold it flat.</text>
<text x="527.6" y="814.0" font-size="12" fill="#333">·  Window edge: 25 × 37 for 135, about 0.5 mm oversize per side so nothing gets cropped.</text>
<text x="40" y="914" font-size="11" fill="#999">Every dimension comes from cad/neobox.blend. Layer names and z values match docs/design.md §2.</text>
