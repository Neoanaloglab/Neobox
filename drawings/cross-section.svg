<text x="40" y="46" font-size="19" font-weight="bold" fill="#111">Cross-section — how a 96 mm box puts the film plane at z = 120.3</text>
<text x="40" y="70" font-size="12.5" fill="#777">Cut across the width of the box (X–Z), seen from the front. Drawn to scale; the detail below is magnified 33×.</text>
<text x="40" y="104" font-size="12" fill="#666">·  The flash never points at the film — it fires sideways into the white cavity.</text>
<text x="650" y="104" font-size="12" fill="#666">·  Light leaves through the 100 × 120 aperture; one opal sheet does the final smoothing.</text>
<text x="40" y="125" font-size="12" fill="#666">·  Three M6 studs carry the stage — two nuts each set its height and clamp it.</text>
<text x="650" y="125" font-size="12" fill="#666">·  The holder just sits on the acrylic, located by the four corner blocks.</text>
