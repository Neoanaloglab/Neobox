<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="460" fill="#ffffff"/>

  <!-- ===== left: optical path schematic (not to scale) ===== -->
  <!-- camera -->
  <rect x="290" y="20" width="60" height="20" fill="#555"/>
  <polygon points="300,40 340,40 332,70 308,70" fill="#555"/>
  <!-- imaging cone film -> lens -->
  <polygon points="265,104 375,104 330,72 310,72" fill="#e8a33d" opacity="0.18"/>

  <!-- film holder lid + base, film, diffuser, stage -->
  <rect x="225" y="92"  width="190" height="12" fill="#4d5563"/>
  <rect x="225" y="104" width="190" height="14" fill="#3c424c"/>
  <line x1="248" y1="110" x2="392" y2="110" stroke="#ff9f43" stroke-width="2.5" stroke-dasharray="7 4"/>
  <rect x="245" y="118" width="150" height="8" fill="#ffe9a8" stroke="#333" stroke-width="1"/>
  <rect x="200" y="126" width="65"  height="8" fill="#2f3238"/>
  <rect x="375" y="126" width="65"  height="8" fill="#2f3238"/>

  <!-- box: top plate with aperture, walls, floor -->
  <g fill="#f2f2f2" stroke="#333" stroke-width="1.1">
    <rect x="60"  y="150" width="195" height="14"/>
    <rect x="385" y="150" width="175" height="14"/>
    <rect x="60"  y="164" width="14"  height="166"/>
    <rect x="546" y="164" width="14"  height="166"/>
    <rect x="60"  y="316" width="500" height="14"/>
  </g>

  <!-- flash + trigger -->
  <rect x="78"  y="265" width="22"  height="40" fill="#7d8794"/>
  <rect x="100" y="255" width="220" height="60" fill="#4a4a52"/>
  <rect x="316" y="260" width="6"   height="50" fill="#ffe9a8"/>

  <!-- light path arrows -->
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#e8a33d"/></marker></defs>
  <g stroke="#e8a33d" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M328,285 L533,285"/>
    <path d="M538,272 L424,183"/>
    <path d="M536,280 L305,197"/>
    <path d="M418,177 L358,153"/>
    <path d="M298,192 L288,155"/>
    <path d="M305,148 L305,124"/>
    <path d="M338,148 L338,124"/>
  </g>

  <!-- numbered badges -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="360" cy="265" r="9" fill="#fff" stroke="#e8a33d" stroke-width="1.5"/><text x="360" y="269" fill="#b97511">1</text>
    <circle cx="505" cy="220" r="9" fill="#fff" stroke="#e8a33d" stroke-width="1.5"/><text x="505" y="224" fill="#b97511">2</text>
    <circle cx="432" cy="105" r="9" fill="#fff" stroke="#b98a11" stroke-width="1.5"/><text x="432" y="109" fill="#b97511">3</text>
    <circle cx="150" cy="140" r="9" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="150" y="144" fill="#333">4</text>
    <circle cx="375" cy="30"  r="9" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="375" y="34" fill="#333">5</text>
  </g>
  <line x1="424" y1="108" x2="398" y2="120" stroke="#b98a11" stroke-width="1"/>
  <line x1="157" y1="146" x2="200" y2="156" stroke="#777" stroke-width="1"/>

  <!-- legend -->
  <g font-size="12.5" fill="#333">
    <text x="60" y="360">1  ストロボは横置きで奥の白壁へ水平発光——フィルムへは向けない。</text>
    <text x="60" y="378">2  白一色の内腔は積分球のように働き、拡散反射が方向をランダム化。</text>
    <text x="60" y="396">3  乳白アクリル 1 枚が最終的に均す。フィルムの 4 mm 下。</text>
    <text x="60" y="414">4  拡散板より上はすべて黒——迷光は反射されず吸収される。</text>
    <text x="60" y="432">5  カメラは均一な発光面を透かしてフィルムを撮影する。</text>
  </g>

  <!-- ===== right: why a flash ===== -->
  <rect x="610" y="135" width="545" height="210" fill="none" stroke="#e5e5e5" stroke-width="1"/>
  <text x="626" y="162" font-size="14" font-weight="bold" fill="#111">なぜストロボか？</text>
  <text x="626" y="184" font-size="11.5" fill="#555">シャッター開放（例：1/60 s）</text>
  <rect x="626" y="190" width="505" height="14" fill="#e0e0e0"/>
  <rect x="830" y="186" width="4" height="22" fill="#e8a33d"/>
  <text x="626" y="226" font-size="11.5" fill="#b97511">閃光パルス 1/1,000 – 1/20,000 s——パルスこそが露光</text>
  <g font-size="12" fill="#333">
    <text x="626" y="250">· 実効シャッター 1/1,000 s 以上——LED パネルなら 1/15–1/60 s 必要</text>
    <text x="626" y="270">· マイクロ秒露光は振動でもシャッターショックでもブレない</text>
    <text x="626" y="290">· ベース ISO と f/8 を余裕をもって使える</text>
    <text x="626" y="310">· 全コマ同一出力 → 反転プロファイルは 1 つ</text>
    <text x="626" y="330">· キセノン管：連続スペクトルのデイライト ≈ 5600 K</text>
  </g>
  <text x="60" y="454" font-size="11" fill="#999">模式図・縮尺なし。詳細：docs/design.ja.md · LED を使わない理由：docs/design-log.ja.md</text>
</svg>
