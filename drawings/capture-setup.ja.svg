<text x="54" y="136" font-size="14" fill="#111" text-anchor="start" font-family="Menlo, Consolas, 'Courier New', monospace">ISO 100 · f/8 · 1/125 s</text>
<text x="54" y="156" font-size="14" fill="#111" text-anchor="start" font-family="Menlo, Consolas, 'Courier New', monospace">ストロボ：マニュアル発光</text>
<text x="40" y="184" font-size="11" fill="#777" text-anchor="start" font-family="Helvetica, Arial, sans-serif">安価な2.4Gトリガーは同調を約1段食うので 1/125 s のままでよい</text>
<text x="40" y="262" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">ミラー調整法：小さな鏡をホルダーの上に置き、</text>
<text x="40" y="280" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">ファインダーでレンズの映り込みを中央に（一度だけ）</text>
<polyline points="372,257.5 610,257.5 610,456" fill="none" stroke="#444" stroke-width="1"/><circle cx="610" cy="456" r="2.2" fill="#444"/>
<text x="40" y="322" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">コマ送り：フィルムをそのまま引き抜く。</text>
<text x="40" y="340" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">フタも押さえ部品も動かさない</text>
<polyline points="294,317.5 526,317.5 526,468" fill="none" stroke="#444" stroke-width="1"/><circle cx="526" cy="468" r="2.2" fill="#444"/>
<text x="40" y="382" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">薄暗い部屋で撮影する。</text>
<text x="40" y="400" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">天井照明を前面開口に直射させない</text>
<polyline points="255,377.5 512,377.5 512,501" fill="none" stroke="#444" stroke-width="1"/><circle cx="512" cy="501" r="2.2" fill="#444"/>
<text x="40" y="440" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">任意のクリップオンストロボ（TT560級）を横置き、</text>
<text x="40" y="458" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">発光部をオープンフロントに密着、マニュアル発光</text>
<polyline points="360.56,435.5 466,435.5 466,525" fill="none" stroke="#444" stroke-width="1"/><circle cx="466" cy="525" r="2.2" fill="#444"/>
<text x="40" y="494" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">2.4Gレシーバー（ZENIKO T1等）はストロボの</text>
<text x="40" y="512" font-size="13" fill="#111" text-anchor="start" font-family="Helvetica, Arial, sans-serif">シューに装着し、箱の外に置いたまま</text>
